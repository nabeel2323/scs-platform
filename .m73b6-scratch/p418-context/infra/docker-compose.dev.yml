# ============================================================
# Smart Commerce & Supply Platform — Local Development Environment
# ============================================================
# Usage:
#   docker compose -f infra/docker-compose.dev.yml up -d
#   pnpm db:migrate && pnpm db:seed
# ============================================================

services:
  # ── PostgreSQL 16 + PostGIS 3.4 ──────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: scs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scs
      POSTGRES_PASSWORD: scs_dev_2026
      POSTGRES_DB: scs_platform
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scs -d scs_platform']
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=100'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'effective_cache_size=768MB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'log_min_messages=warning'
      - '-c'
      - 'log_timezone=UTC'
      - '-c'
      - 'timezone=UTC'

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scs-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']

  # ── MinIO (S3-compatible object storage) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: scs-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: scs_minio
      MINIO_ROOT_PASSWORD: scs_minio_2026
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ':9001'

  # ── Mailhog (email testing) ──────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: scs-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v2/messages']
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MinIO bucket initialization ──────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: scs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 scs_minio scs_minio_2026;
        mc mb local/scs-media --ignore-existing;
        mc mb local/scs-uploads --ignore-existing;
        mc anonymous set download local/scs-media;
        echo 'MinIO buckets initialized';
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
