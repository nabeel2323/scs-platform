name: Temporary format and self-remove

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

concurrency:
  group: temporary-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format all PR-touched source and project documentation
        run: |
          pnpm exec prettier --write \
            "apps/admin/src/app/orders/[id]/page.tsx" \
            "apps/admin/src/app/page.tsx" \
            "apps/admin/src/app/payments/page.tsx" \
            "apps/admin/src/app/requests/page.tsx" \
            "apps/admin/src/lib/api.ts" \
            "apps/admin/src/components/AdminSidebar.tsx" \
            "apps/admin/src/components/AdminSidebar.css" \
            "apps/web/src/app/merchant/product-studio/steps/StepOffer.tsx" \
            "docs/remediation/G-002-RLS-ARCHITECTURE-DESIGN.md" \
            "docs/remediation/G-002-TABLE-OWNERSHIP-MATRIX.md" \
            "docs/remediation/IMPLEMENTATION-PROGRESS.md" \
            "project-memory/CURRENT-STATE.md" \
            "project-memory/DECISIONS-AND-CONSTRAINTS.md" \
            "project-memory/IMPLEMENTATION-GAP-REGISTER.md" \
            "project-memory/IMPLEMENTATION-ROADMAP.md" \
            "project-memory/OPEN-ISSUES.md" \
            "project-memory/RELEASE-AND-CI-STATUS.md" \
            "project-memory/START-HERE.md" \
            "project-memory/WHOLE-PRODUCT-IMPLEMENTATION-INVENTORY.md" \
            "project-memory/WORK-LOG.md"

      - name: Remove temporary workflow and commit formatting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "apps/admin/src/app/orders/[id]/page.tsx" \
            "apps/admin/src/app/page.tsx" \
            "apps/admin/src/app/payments/page.tsx" \
            "apps/admin/src/app/requests/page.tsx" \
            "apps/admin/src/lib/api.ts" \
            "apps/admin/src/components/AdminSidebar.tsx" \
            "apps/admin/src/components/AdminSidebar.css" \
            "apps/web/src/app/merchant/product-studio/steps/StepOffer.tsx" \
            "docs/remediation/G-002-RLS-ARCHITECTURE-DESIGN.md" \
            "docs/remediation/G-002-TABLE-OWNERSHIP-MATRIX.md" \
            "docs/remediation/IMPLEMENTATION-PROGRESS.md" \
            "project-memory/CURRENT-STATE.md" \
            "project-memory/DECISIONS-AND-CONSTRAINTS.md" \
            "project-memory/IMPLEMENTATION-GAP-REGISTER.md" \
            "project-memory/IMPLEMENTATION-ROADMAP.md" \
            "project-memory/OPEN-ISSUES.md" \
            "project-memory/RELEASE-AND-CI-STATUS.md" \
            "project-memory/START-HERE.md" \
            "project-memory/WHOLE-PRODUCT-IMPLEMENTATION-INVENTORY.md" \
            "project-memory/WORK-LOG.md"
          git rm .github/workflows/temporary-format-and-remove.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format implementation and project memory files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
