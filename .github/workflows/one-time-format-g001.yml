name: One-time G-001 formatting

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

jobs:
  format:
    if: startsWith(github.event.head_commit.message, 'chore: run one-time Prettier for G-001')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only the G-001 test files
        run: |
          pnpm exec prettier --write \
            apps/api/src/__tests__/integration/catalog-lifecycle.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase1-marketplace.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase2-multi-merchant.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase3-security.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts \
            apps/api/src/__tests__/integration/transaction-lifecycle.e2e.spec.ts \
            apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts
      - name: Commit formatted files and remove this one-time workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-format-g001.yml
          git add \
            apps/api/src/__tests__/integration/catalog-lifecycle.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase1-marketplace.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase2-multi-merchant.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase3-security.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts \
            apps/api/src/__tests__/integration/transaction-lifecycle.e2e.spec.ts \
            apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts
          git commit -m "style(security): format G-001 tenant-context tests"
          git push origin "HEAD:${BRANCH_NAME}"
