name: One-time remediation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - .github/workflows/format-remediation.yml

permissions:
  contents: write

concurrency:
  group: remediation-one-time-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify changed remediation files
        run: |
          pnpm exec prettier --write \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            docs/remediation/IMPLEMENTATION-PLAN.md \
            apps/api/infra/drizzle/migration-identity.ts \
            apps/api/infra/drizzle/migrate-pg.ts \
            apps/api/src/__tests__/unit/migration-identity.spec.ts \
            apps/api/src/__tests__/integration/migration-lock.postgres.spec.ts
          pnpm exec prettier --check \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            docs/remediation/IMPLEMENTATION-PLAN.md \
            apps/api/infra/drizzle/migration-identity.ts \
            apps/api/infra/drizzle/migrate-pg.ts \
            apps/api/src/__tests__/unit/migration-identity.spec.ts \
            apps/api/src/__tests__/integration/migration-lock.postgres.spec.ts

      - name: Commit formatting and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            docs/remediation/IMPLEMENTATION-PLAN.md \
            apps/api/infra/drizzle/migration-identity.ts \
            apps/api/infra/drizzle/migrate-pg.ts \
            apps/api/src/__tests__/unit/migration-identity.spec.ts \
            apps/api/src/__tests__/integration/migration-lock.postgres.spec.ts
          git rm .github/workflows/format-remediation.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style(remediation): format migration identity and evidence updates"
          git push origin HEAD:refs/heads/remediation/phase-0-1-tenant-security
