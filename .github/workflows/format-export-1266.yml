name: Temporary PR 138 Prettier Export 1266

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-and-export:
    if: github.repository == 'nabeel2323/scs-platform' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remediation/phase-0-1-tenant-security'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the CI-reported files
        run: |
          pnpm exec prettier --write \
            apps/api/src/__tests__/integration/phase1-marketplace.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase2-multi-merchant.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase3-security.e2e.spec.ts \
            apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts \
            apps/api/src/__tests__/integration/transaction-lifecycle.e2e.spec.ts \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/CURRENT-STATE.md \
            project-memory/IMPLEMENTATION-ROADMAP.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/START-HERE.md \
            project-memory/WORK-LOG.md \
            .github/workflows/format-export-1266.yml
      - name: Export formatted files
        run: |
          echo "TREE_SHA:$(git rev-parse HEAD^{tree})"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = [
            'apps/api/src/__tests__/integration/phase1-marketplace.e2e.spec.ts',
            'apps/api/src/__tests__/integration/phase2-multi-merchant.e2e.spec.ts',
            'apps/api/src/__tests__/integration/phase3-security.e2e.spec.ts',
            'apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts',
            'apps/api/src/__tests__/integration/transaction-lifecycle.e2e.spec.ts',
            'docs/remediation/IMPLEMENTATION-PROGRESS.md',
            'project-memory/CURRENT-STATE.md',
            'project-memory/IMPLEMENTATION-ROADMAP.md',
            'project-memory/OPEN-ISSUES.md',
            'project-memory/RELEASE-AND-CI-STATUS.md',
            'project-memory/START-HERE.md',
            'project-memory/WORK-LOG.md',
          ];
          for (const file of files) {
            const encoded = readFileSync(file).toString('base64');
            console.log('FORMAT_EXPORT_BEGIN:' + file);
            for (let i = 0; i < encoded.length; i += 30000) {
              console.log('FORMAT_EXPORT_CHUNK:' + encoded.slice(i, i + 30000));
            }
            console.log('FORMAT_EXPORT_END:' + file);
          }
          NODE
