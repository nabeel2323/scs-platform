name: One-time PR formatting repair

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

concurrency:
  group: scs-pr-138-format-repair
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/remediation/phase-0-1-tenant-security' && github.repository == 'nabeel2323/scs-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format all PR-changed source and documentation files
        shell: bash
        run: |
          git fetch origin develop
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR origin/develop...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yaml' '*.yml')
          if (( ${#files[@]} == 0 )); then
            echo "No supported PR-changed files found."
            exit 0
          fi
          pnpm exec prettier --write "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "All PR-changed files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format PR #138 changed files [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
