name: One-time phase4 formatting correction

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify phase4
        run: |
          pnpm exec prettier --write apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts
          pnpm exec prettier --check apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts
      - name: Commit formatting and remove this one-time workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-prettier-once.yml
          git add apps/api/src/__tests__/integration/phase4-import-commerce.e2e.spec.ts
          git commit -m "style(security): normalize phase4 store membership fixture"
          git push origin "HEAD:${BRANCH_NAME}"
