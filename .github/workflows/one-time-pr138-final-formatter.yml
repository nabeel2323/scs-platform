name: One-time PR #138 final Prettier pass

on:
  push:
    branches:
      - automation/format-pr138-final2-20261123

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'nabeel2323/scs-platform' && github.ref == 'refs/heads/automation/format-pr138-final2-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check out active PR branch
        run: |
          git fetch origin remediation/phase-0-1-tenant-security
          git checkout -B format-target FETCH_HEAD
      - run: pnpm install --frozen-lockfile
      - name: Format and verify active PR sources and handoff
        run: |
          FILES="apps/api/scripts/audit-db-access.ts apps/api/src/__tests__/integration/m73b331-cancel-execution.postgres.spec.ts apps/api/src/__tests__/integration/m73b3321-retry-state-foundation.postgres.spec.ts apps/api/src/__tests__/unit/shipping/m73b331-handle-cancel.spec.ts apps/api/src/__tests__/unit/shipping/m73b3321-retry-state-foundation.spec.ts docs/remediation/IMPLEMENTATION-PROGRESS.md project-memory/CURRENT-STATE.md project-memory/IMPLEMENTATION-GAP-REGISTER.md project-memory/IMPLEMENTATION-ROADMAP.md project-memory/OPEN-ISSUES.md project-memory/RELEASE-AND-CI-STATUS.md project-memory/START-HERE.md project-memory/WORK-LOG.md"
          pnpm exec prettier --write $FILES
          pnpm exec prettier --check $FILES
          git add $FILES
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format latest PR #138 handoff [skip ci]"
          git push origin HEAD:refs/heads/remediation/phase-0-1-tenant-security
