name: One-time PR #138 complete continuation formatter

on:
  push:
    branches:
      - automation/format-pr138-final2-20261123

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'nabeel2323/scs-platform' && github.ref == 'refs/heads/automation/format-pr138-final2-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check out active PR branch
        run: |
          git fetch origin remediation/phase-0-1-tenant-security
          git checkout -B format-target FETCH_HEAD
      - run: pnpm install --frozen-lockfile
      - name: Format and verify active PR sources and handoff
        run: |
          FILES="apps/api/scripts/audit-db-access.ts apps/api/src/__tests__/integration/m73b331-cancel-execution.postgres.spec.ts apps/api/src/__tests__/integration/m73b3321-retry-state-foundation.postgres.spec.ts apps/api/src/__tests__/integration/p13-financial-dispute.postgres.spec.ts apps/api/src/__tests__/integration/p13-returns.postgres.spec.ts apps/api/src/__tests__/integration/p4-operational-readiness.postgres.spec.ts apps/api/src/__tests__/unit/catalog/catalog-pricing-lookup.service.spec.ts apps/api/src/__tests__/unit/catalog/catalog-review-lookup.service.spec.ts apps/api/src/__tests__/unit/common/outbox/outbox-dispatcher.spec.ts apps/api/src/__tests__/unit/operations/pilot-control-allowlist-tenant-scope.spec.ts apps/api/src/__tests__/unit/operations/pilot-control-public-contract.spec.ts apps/api/src/__tests__/unit/orders/order-realtime-access.service.spec.ts apps/api/src/__tests__/unit/pricing/pricing-service-tenant-scope.spec.ts apps/api/src/__tests__/unit/pricing/pricing-service-tier-enrichment.spec.ts apps/api/src/__tests__/unit/pricing/pricing-service-variant-tier-store-scope.spec.ts apps/api/src/__tests__/unit/realtime/realtime.gateway.spec.ts apps/api/src/__tests__/unit/reviews/reviews-service-order-review-visibility.spec.ts apps/api/src/__tests__/unit/reviews/reviews-service-order-subject-scope.spec.ts apps/api/src/__tests__/unit/shipping/m73b331-handle-cancel.spec.ts apps/api/src/__tests__/unit/shipping/m73b3321-retry-state-foundation.spec.ts apps/api/src/modules/catalog/catalog-pricing-lookup.service.ts apps/api/src/modules/catalog/catalog-review-lookup.service.ts apps/api/src/modules/catalog/catalog.module.ts apps/api/src/modules/catalog/index.ts apps/api/src/modules/identity/index.ts apps/api/src/modules/merchant/index.ts apps/api/src/modules/operations/operations.module.ts apps/api/src/modules/operations/pilot-control.service.ts apps/api/src/modules/orders/index.ts apps/api/src/modules/orders/order-realtime-access.service.ts apps/api/src/modules/orders/orders.module.ts apps/api/src/modules/orders/orders.service.ts apps/api/src/modules/pricing/pricing.service.ts apps/api/src/modules/realtime/realtime.gateway.ts apps/api/src/modules/realtime/realtime.module.ts apps/api/src/modules/reviews/reviews.module.ts apps/api/src/modules/reviews/reviews.service.ts apps/api/src/modules/shipping/shipping-carrier.worker.ts .github/workflows/ci.yml docs/remediation/IMPLEMENTATION-PROGRESS.md project-memory/CURRENT-STATE.md project-memory/IMPLEMENTATION-GAP-REGISTER.md project-memory/IMPLEMENTATION-ROADMAP.md project-memory/OPEN-ISSUES.md project-memory/RELEASE-AND-CI-STATUS.md project-memory/START-HERE.md project-memory/WORK-LOG.md"
          pnpm exec prettier --write $FILES
          pnpm exec prettier --check $FILES
          git add $FILES
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format latest PR #138 handoff [skip ci]"
          git push origin HEAD:refs/heads/remediation/phase-0-1-tenant-security
