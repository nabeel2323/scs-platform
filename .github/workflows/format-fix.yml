name: One-time remediation formatting

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.ref == 'refs/heads/remediation/phase-0-1-tenant-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source and documentation
        run: >-
          pnpm exec prettier --write
          README.md
          docs/remediation/IMPLEMENTATION-PLAN.md
          docs/remediation/IMPLEMENTATION-PROGRESS.md
          project-memory/*.md
          apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts
      - name: Remove temporary formatter and commit
        run: |
          rm .github/workflows/format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md project-memory/*.md apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts .github/workflows/format-fix.yml
          git commit -m "style(project): format final handover checkpoint"
          git push origin HEAD:remediation/phase-0-1-tenant-security
