name: One-time remediation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - .github/workflows/format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files with the repository-locked Prettier
        run: pnpm exec prettier --write apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts docs/remediation/IMPLEMENTATION-PROGRESS.md
      - name: Remove one-time formatter and commit the formatted files
        run: |
          rm .github/workflows/format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts docs/remediation/IMPLEMENTATION-PROGRESS.md .github/workflows/format-fix.yml
          git commit -m "chore: format merchant authorization remediation"
          git push
