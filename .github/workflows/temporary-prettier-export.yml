name: Temporary Prettier Export

on:
  pull_request:
    branches:
      - develop

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the OTP logging files
        run: >
          pnpm exec prettier --write
          apps/api/src/__tests__/unit/notifications/otp-delivery-providers.spec.ts
          apps/api/src/modules/notifications/providers/twilio-sms.provider.ts
          apps/api/src/modules/notifications/providers/whatsapp.provider.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-otp-logging-files
          path: |
            apps/api/src/__tests__/unit/notifications/otp-delivery-providers.spec.ts
            apps/api/src/modules/notifications/providers/twilio-sms.provider.ts
            apps/api/src/modules/notifications/providers/whatsapp.provider.ts
          retention-days: 1
