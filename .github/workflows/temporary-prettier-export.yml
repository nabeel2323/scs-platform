name: Temporary Prettier Export

on:
  pull_request:
    branches:
      - develop

jobs:
  format-export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'remediation/phase-0-1-tenant-security'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the OTP logging files
        run: >
          pnpm exec prettier --write
          apps/api/src/__tests__/unit/notifications/otp-delivery-providers.spec.ts
          apps/api/src/modules/notifications/providers/twilio-sms.provider.ts
          apps/api/src/modules/notifications/providers/whatsapp.provider.ts
      - name: Commit formatter output
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/api/src/__tests__/unit/notifications/otp-delivery-providers.spec.ts             apps/api/src/modules/notifications/providers/twilio-sms.provider.ts             apps/api/src/modules/notifications/providers/whatsapp.provider.ts
          git commit -m "style: format OTP logging changes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
