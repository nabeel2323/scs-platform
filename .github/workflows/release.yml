# ============================================================
# Smart Commerce Platform — Automated Staging Release Pipeline
# ============================================================
# Architecture v2.1: REUSABLE WORKFLOW invoked by CI
# Trigger: workflow_call from CI (after all CI jobs succeed on develop)
# Target: staging environment (scs-api-staging.onrender.com)
#
# CRITICAL ARCHITECTURE CHANGE:
# This is now a reusable workflow (workflow_call), NOT workflow_run.
# Reason: workflow_run requires the triggered workflow to exist on the
# default branch (main). This workflow exists on develop. The reusable
# pattern solves this by having CI explicitly invoke it after success.
#
# This avoids the default-branch trigger requirement and ensures the
# release only runs after verified CI success on develop.
#
# Strict 12-step release sequence:
# 1. Validate triggering CI run and commit
# 2. Confirm target is intended develop release
# 3. Validate configuration and secrets
# 4. Install dependencies with frozen lockfile
# 5. Run migration runner against staging database
# 6. Run RBAC seed only
# 7. Verify every migration file is in _migration_log
# 8. Trigger Render deployment for exact same commit SHA
# 9. Poll deployment until terminal result
# 10. Verify deployed commit SHA
# 11. Check https://scs-api-staging.onrender.com/v1/readyz
# 12. Publish final release summary
# ============================================================

name: Staging Release

on:
  # REUSABLE WORKFLOW: Invoked by CI after all mandatory gates succeed on develop.
  # This pattern replaces workflow_run and avoids the default-branch trigger
  # requirement — a reusable workflow is resolved by path, not by default branch.
  #
  # SECRETS: We intentionally do NOT declare staging secrets here. Environment-
  # scoped staging secrets are resolved by each job below that declares
  # `environment: staging` (the caller forwards the context via `secrets: inherit`).
  # Declaring them as workflow_call inputs would let an environment-less caller
  # pass empty values and shadow the real environment secrets.
  workflow_call:
    inputs:
      commit_sha:
        description: 'Commit SHA to release (exact SHA whose CI succeeded)'
        required: true
        type: string
      ci_run_id:
        description: 'CI run ID that triggered this release'
        required: true
        type: string
      ci_run_url:
        description: 'CI run URL for audit trail'
        required: true
        type: string
  
  # Manual trigger for authorized releases from develop.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to release (must be on develop)'
        required: true
        type: string
      skip_confirmation:
        description: 'Skip manual confirmation (use with caution)'
        required: false
        type: boolean
        default: false

# Serialize all staging releases — only one release can run at a time.
# GitHub concurrency behavior: one running + one pending. If a third run is
# queued while one is pending, the older pending run is replaced. This means
# we cannot claim FIFO execution. We implement explicit stale-release
# awareness: before any database mutation, detect whether a newer release is
# queued (ordered by monotonic run_number). POLICY = allow-complete: if a newer
# run is queued we do NOT abort an in-flight migration, because leaving the
# schema half-migrated is worse than letting the current release finish for
# consistency; the newer run then applies cleanly afterwards.
concurrency:
  group: staging-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
  RENDER_API_BASE: https://api.render.com/v1

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  # ── Step 1-3: Validate trigger and configuration ─────────────────────────
  validate:
    name: Validate Release Trigger
    runs-on: ubuntu-latest
    # Staging environment grants this job access to environment-scoped secrets
    # so it can verify their presence. The job is read-only (no DB mutation).
    environment: staging
    # Runs for both invocation modes:
    #   - workflow_call from CI  -> github.event_name mirrors the CALLER event ('push')
    #   - workflow_dispatch      -> github.event_name == 'workflow_dispatch'
    # IMPORTANT: inside a called workflow github.event_name is the caller's event,
    # NEVER the literal string 'workflow_call'. Conditions must not test for it.
    
    outputs:
      release_sha: ${{ steps.determine_sha.outputs.release_sha }}
      ci_run_id: ${{ steps.determine_sha.outputs.ci_run_id }}
      ci_run_url: ${{ steps.determine_sha.outputs.ci_run_url }}
    
    steps:
      # Checkout so git reachability checks have a repository with full history
      # (fetch-depth: 0 avoids shallow-clone false negatives on merge-base).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Determine and validate release SHA
        id: determine_sha
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          THIS_REF: ${{ github.ref }}
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          
          EVENT="${{ github.event_name }}"
          
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # ===== MANUAL DISPATCH PATH — comprehensive validation =====
            RELEASE_SHA="${{ inputs.commit_sha }}"
            echo "Manual trigger: validating SHA $RELEASE_SHA"
            
            # 1. Validate SHA format (40 hex chars)
            if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "✗ Invalid SHA format: $RELEASE_SHA"
              echo "  Expected: 40 hexadecimal characters"
              exit 1
            fi
            echo "  ✓ SHA format valid"
            
            # 2. Verify SHA exists in repository
            if ! git cat-file -e "$RELEASE_SHA" 2>/dev/null; then
              echo "✗ SHA does not exist in repository: $RELEASE_SHA"
              exit 1
            fi
            echo "  ✓ SHA exists in repository"
            
            # 3. Verify SHA is reachable from develop (populate origin/develop ref)
            git fetch --force --no-tags origin '+develop:refs/remotes/origin/develop'
            if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/develop; then
              echo "✗ SHA is not reachable from develop: $RELEASE_SHA"
              echo "  Only commits on the develop branch can be released"
              exit 1
            fi
            echo "  ✓ SHA is reachable from develop"
            
            # 4. Find a successful CI run for this exact SHA on develop
            echo "  Searching for successful CI run..."
            CI_RUNS=$(gh run list \
              --workflow=ci.yml \
              --branch=develop \
              --json databaseId,headSha,headBranch,status,conclusion \
              --limit 50)
            
            MATCHING_RUN=$(echo "$CI_RUNS" | jq -r --arg sha "$RELEASE_SHA" '
              .[] | select(.headSha == $sha and .conclusion == "success" and .headBranch == "develop") | .databaseId' | head -1)
            
            if [ -z "$MATCHING_RUN" ]; then
              echo "✗ No successful CI run found on develop for SHA: $RELEASE_SHA"
              echo "  Rejecting release: the commit must have a passing develop CI run"
              exit 1
            fi
            echo "  ✓ Found successful develop CI run: $MATCHING_RUN"
            
            echo "release_sha=$RELEASE_SHA" >> $GITHUB_OUTPUT
            echo "ci_run_id=$MATCHING_RUN" >> $GITHUB_OUTPUT
            echo "ci_run_url=$SERVER_URL/$REPOSITORY/actions/runs/$MATCHING_RUN" >> $GITHUB_OUTPUT
            echo "✓ Manual SHA validation passed: $RELEASE_SHA"
          else
            # ===== AUTOMATED PATH — reusable workflow called by CI =====
            # github.event_name here is the caller's event. For a legitimate
            # develop release that is 'push'. Reject anything else (defense in depth:
            # a PR or main-triggered caller must never reach this path).
            if [ "$EVENT" != "push" ]; then
              echo "✗ Automated release must originate from a push event; got '$EVENT'"
              exit 1
            fi
            if [ "$THIS_REF" != "refs/heads/develop" ]; then
              echo "✗ Automated release must target develop; got '$THIS_REF'"
              exit 1
            fi
            if [ "$REPOSITORY" != "nabeel2323/scs-platform" ]; then
              echo "✗ Unexpected repository context: $REPOSITORY"
              exit 1
            fi
            
            RELEASE_SHA="${{ inputs.commit_sha }}"
            
            # Exact-SHA binding: the input SHA must equal this run's own head SHA,
            # i.e. the precise commit whose CI just succeeded.
            if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "✗ Invalid commit_sha input format: $RELEASE_SHA"
              exit 1
            fi
            if [ "$RELEASE_SHA" != "$THIS_SHA" ]; then
              echo "✗ commit_sha input does not match CI run head SHA"
              echo "  input: $RELEASE_SHA"
              echo "  run:   $THIS_SHA"
              exit 1
            fi
            echo "  ✓ commit_sha matches the CI run head SHA ($RELEASE_SHA)"
            
            # Reachability guard against develop (defense in depth).
            git fetch --force --no-tags origin '+develop:refs/remotes/origin/develop'
            if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/develop; then
              echo "✗ SHA is not reachable from develop: $RELEASE_SHA"
              exit 1
            fi
            echo "  ✓ SHA is reachable from develop"
            
            echo "release_sha=$RELEASE_SHA" >> $GITHUB_OUTPUT
            echo "ci_run_id=${{ inputs.ci_run_id }}" >> $GITHUB_OUTPUT
            echo "ci_run_url=${{ inputs.ci_run_url }}" >> $GITHUB_OUTPUT
            echo "✓ Automated release SHA accepted: $RELEASE_SHA"
            echo "  CI Run: ${{ inputs.ci_run_id }}"
            echo "  URL: ${{ inputs.ci_run_url }}"
          fi
      
      - name: Release audit metadata
        run: |
          set -euo pipefail
          echo "Release trigger audit:"
          echo "  Trigger event: ${{ github.event_name }}"
          echo "  Release SHA:   ${{ steps.determine_sha.outputs.release_sha }}"
          echo "  CI Run ID:     ${{ steps.determine_sha.outputs.ci_run_id }}"
          echo "  CI Run URL:    ${{ steps.determine_sha.outputs.ci_run_url }}"
      
      - name: Confirm develop release target
        run: |
          echo "✓ Release target confirmed: staging environment (develop branch)"
          echo "  Service: scs-api-staging.onrender.com"
          echo "  Environment: staging"
      
      - name: Validate configuration and secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_PGSSLROOTCERT_PEM: ${{ secrets.STAGING_PGSSLROOTCERT_PEM }}
        run: |
          # Check required secrets are configured
          MISSING=()
          
          if [ -z "$RENDER_API_KEY" ]; then
            MISSING+=("RENDER_API_KEY")
          fi
          
          if [ -z "$STAGING_DATABASE_URL" ]; then
            MISSING+=("STAGING_DATABASE_URL")
          fi
          
          if [ -z "$STAGING_PGSSLROOTCERT_PEM" ]; then
            MISSING+=("STAGING_PGSSLROOTCERT_PEM")
          fi
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "✗ Missing required secrets:"
            for secret in "${MISSING[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "Configure these as environment-scoped secrets for the 'staging' environment."
            exit 1
          fi
          
          # Check required variables
          if [ -z "${{ env.RENDER_SERVICE_ID }}" ]; then
            echo "✗ Missing required variable: RENDER_SERVICE_ID"
            echo "Configure this as an environment variable for the 'staging' environment."
            exit 1
          fi
          
          echo "✓ All required secrets and variables are configured"
          echo "  RENDER_SERVICE_ID: ${{ env.RENDER_SERVICE_ID }}"
          echo "  Secrets: [REDACTED]"

  # ── Step 4-7: Database release (migrations + seed + verification) ────────
  database-release:
    name: Database Migration & Seed
    runs-on: ubuntu-latest
    needs: validate
    environment: staging
    
    steps:
      - name: Check for stale release (pre-mutation safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          RELEASE_SHA="${{ needs.validate.outputs.release_sha }}"
          CURRENT_RUN_ID="${{ github.run_id }}"
          CURRENT_RUN_NUMBER="${{ github.run_number }}"
          
          echo "Checking for stale release before database mutation..."
          echo "  Release SHA: $RELEASE_SHA"
          echo "  Current run ID: $CURRENT_RUN_ID"
          echo "  Current run number: $CURRENT_RUN_NUMBER"
          
          # FIX: Use run_number (monotonic ordering) instead of createdAt comparison
          # Get all queued runs for this workflow
          QUEUED_RUNS=$(gh run list \
            --workflow=release.yml \
            --status=queued \
            --json databaseId,runNumber \
            --limit 10)
          
          # FIX: Check if any newer run is queued using run_number (not createdAt)
          NEWER_RUNS=$(echo "$QUEUED_RUNS" | jq -r --argjson current "$CURRENT_RUN_NUMBER" '
            [.[] | select(.runNumber > $current)] | length')
          
          if [ "$NEWER_RUNS" -gt 0 ]; then
            NEWER_IDS=$(echo "$QUEUED_RUNS" | jq -r --argjson current "$CURRENT_RUN_NUMBER" '
              [.[] | select(.runNumber > $current)] | map(.databaseId) | join(", ")')
            
            echo "⚠ NEWER RELEASE(S) QUEUED: $NEWER_RUNS run(s)"
            echo "  Run IDs: $NEWER_IDS"
            echo ""
            echo "  POLICY: Allow current migration to complete"
            echo "  GitHub concurrency: one-running + one-pending (NOT FIFO)"
            echo "  The newer run will queue after this completes"
            echo "  No abort: current database operation should finish for consistency"
          else
            echo "✓ No newer release queued — proceeding with database mutation"
          fi
      
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      
      # CRITICAL FIX: SSL Certificate Lifecycle
      # 
      # Previous implementation had a fatal bug:
      # - Trap handler was set in "Prepare SSL" step
      # - That step exited, firing the trap, deleting the certificate
      # - Subsequent migration steps received a path to a deleted file
      #
      # New implementation:
      # - Single script owns the complete lifecycle
      # - Certificate created, used by all DB operations, then cleaned
      # - Trap fires only when the entire database sequence completes
      # - No step boundary issues
      #
      - name: Execute database operations with SSL certificate
        env:
          STAGING_PGSSLROOTCERT_PEM: ${{ secrets.STAGING_PGSSLROOTCERT_PEM }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: staging
        run: |
          set -euo pipefail
          
          # ============================================================
          # SSL CERTIFICATE LIFECYCLE (SINGLE SCRIPT EXECUTION)
          # ============================================================
          
          echo "=== SSL Certificate Lifecycle: START ==="
          
          # Create temporary directory
          SSL_DIR=$(mktemp -d)
          SSL_FILE="$SSL_DIR/ca-certificate.pem"
          
          # Cleanup function
          cleanup_ssl() {
            echo ""
            echo "=== SSL Certificate Lifecycle: CLEANUP ==="
            if [ -d "$SSL_DIR" ]; then
              rm -rf "$SSL_DIR"
              echo "✓ SSL certificate removed: $SSL_FILE"
            fi
          }
          
          # Set trap - fires when THIS SCRIPT exits (not intermediate steps)
          trap cleanup_ssl EXIT ERR INT TERM
          
          echo "  Created SSL directory: $SSL_DIR"
          umask 077
          echo "$STAGING_PGSSLROOTCERT_PEM" > "$SSL_FILE"
          
          if [ ! -s "$SSL_FILE" ]; then
            echo "✗ SSL certificate file is empty"
            exit 1
          fi
          
          PERMS=$(stat -c %a "$SSL_FILE" 2>/dev/null || stat -f %Lp "$SSL_FILE")
          if [ "$PERMS" != "600" ]; then
            echo "✗ SSL certificate permissions: $PERMS (expected 600)"
            exit 1
          fi
          
          echo "✓ SSL certificate ready: $SSL_FILE (permissions: $PERMS)"
          
          # ============================================================
          # DATABASE OPERATION 1: Run migration runner
          # ============================================================
          echo ""
          echo "=== Database Operation 1: Migration Runner ==="
          echo "  SSL file available: $SSL_FILE"
          echo "  Advisory lock: PostgreSQL session-scoped two-key identity"
          
          PGSSLROOTCERT="$SSL_FILE" pnpm --filter @scs/api db:migrate
          
          echo "✓ Migration completed successfully"
          
          # ============================================================
          # DATABASE OPERATION 2: Run RBAC seed (idempotent)
          # ============================================================
          echo ""
          echo "=== Database Operation 2: RBAC Seed ==="
          echo "  SSL file still available: $SSL_FILE"
          echo "  Strategy: ON CONFLICT DO NOTHING (safe to re-run)"
          
          PGSSLROOTCERT="$SSL_FILE" pnpm --filter @scs/api db:seed
          
          echo "✓ RBAC seed completed successfully"
          
          # ============================================================
          # DATABASE OPERATION 3: Verify migration ledger
          # ============================================================
          echo ""
          echo "=== Database Operation 3: Migration Ledger Verification ==="
          echo "  SSL file still available: $SSL_FILE"
          
          SCRIPT_PATH="apps/api/scripts/verify-migration-ledger.mjs"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "✗ Verification script not found: $SCRIPT_PATH"
            exit 1
          fi
          
          PGSSLROOTCERT="$SSL_FILE" node "$SCRIPT_PATH"
          
          echo "✓ Migration ledger verified"
          
          # ============================================================
          # ALL DATABASE OPERATIONS COMPLETE
          # Trap will fire on EXIT and clean up SSL certificate
          # ============================================================
          echo ""
          echo "=== All database operations completed ==="
          echo "  SSL cleanup will execute automatically (EXIT trap)"

  # ── Step 8-10: Render deployment ─────────────────────────────────────────
  deploy:
    name: Render Deployment
    runs-on: ubuntu-latest
    needs: [validate, database-release]
    environment: staging
    
    outputs:
      deploy_id: ${{ steps.trigger_deploy.outputs.deploy_id }}
      deploy_status: ${{ steps.poll_deploy.outputs.deploy_status }}
    
    steps:
      - name: Trigger Render deployment
        id: trigger_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          
          RELEASE_SHA="${{ needs.validate.outputs.release_sha }}"
          
          echo "Triggering Render deployment..."
          echo "  Service ID: ${{ env.RENDER_SERVICE_ID }}"
          echo "  Commit SHA: $RELEASE_SHA"
          
          # Trigger deployment with explicit commitId
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.RENDER_API_BASE }}/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"commitId\": \"$RELEASE_SHA\",
              \"clearCache\": \"do_not_clear\"
            }")
          
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          
          # Validate HTTP response
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "✗ Deployment trigger failed"
            echo "  HTTP Status: $HTTP_CODE"
            echo "  Response: $BODY"
            exit 1
          fi
          
          # Validate JSON response structure
          if ! echo "$BODY" | jq empty 2>/dev/null; then
            echo "✗ Deployment trigger returned malformed JSON"
            echo "  Response: $BODY"
            exit 1
          fi
          
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // empty')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "✗ Deployment trigger response missing deploy ID"
            echo "  Response: $BODY"
            exit 1
          fi
          
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "✓ Deployment triggered successfully"
          echo "  Deploy ID: $DEPLOY_ID"
          echo "  HTTP Status: $HTTP_CODE"
      
      - name: Poll deployment status
        id: poll_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          
          DEPLOY_ID="${{ steps.trigger_deploy.outputs.deploy_id }}"
          MAX_WAIT=600  # 10 minutes
          POLL_INTERVAL=15
          ELAPSED=0
          
          echo "Polling deployment status..."
          echo "  Deploy ID: $DEPLOY_ID"
          echo "  Max wait: ${MAX_WAIT}s"
          echo "  Poll interval: ${POLL_INTERVAL}s"
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              "${{ env.RENDER_API_BASE }}/services/${{ env.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY")
            
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
            BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            
            # Validate HTTP response
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "  [$ELAPSED/${MAX_WAIT}s] API error (HTTP $HTTP_CODE)"
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi
            
            # Validate JSON response
            if ! echo "$BODY" | jq empty 2>/dev/null; then
              echo "  [$ELAPSED/${MAX_WAIT}s] Malformed API response"
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi
            
            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            
            echo "  [$ELAPSED/${MAX_WAIT}s] Status: $STATUS"
            
            # Check for terminal states
            case "$STATUS" in
              live)
                echo "✓ Deployment successful (status: live)"
                echo "deploy_status=live" >> $GITHUB_OUTPUT
                exit 0
                ;;
              failed|build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "✗ Deployment failed (status: $STATUS)"
                echo "deploy_status=$STATUS" >> $GITHUB_OUTPUT
                exit 1
                ;;
              unknown)
                echo "⚠ Unknown deployment status — continuing to poll"
                ;;
            esac
            
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          
          echo "✗ Deployment polling timeout after ${MAX_WAIT}s"
          echo "deploy_status=timeout" >> $GITHUB_OUTPUT
          exit 1
      
      - name: Verify deployed commit SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          
          DEPLOY_ID="${{ steps.trigger_deploy.outputs.deploy_id }}"
          EXPECTED_SHA="${{ needs.validate.outputs.release_sha }}"
          
          echo "Verifying deployed commit SHA..."
          
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ env.RENDER_API_BASE }}/services/${{ env.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          
          # Validate HTTP response
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "✗ Failed to retrieve deployment details (HTTP $HTTP_CODE)"
            echo "  Response: $BODY"
            exit 1
          fi
          
          # Validate JSON response
          if ! echo "$BODY" | jq empty 2>/dev/null; then
            echo "✗ Deployment details response is malformed JSON"
            echo "  Response: $BODY"
            exit 1
          fi
          
          # CRITICAL: Render API returns commit SHA in .commit.id, not .commitId
          DEPLOYED_SHA=$(echo "$BODY" | jq -r '.commit.id // empty')
          
          if [ -z "$DEPLOYED_SHA" ]; then
            echo "✗ Deployment details response missing commit ID"
            echo "  Response: $BODY"
            exit 1
          fi
          
          echo "  Expected SHA: $EXPECTED_SHA"
          echo "  Deployed SHA: $DEPLOYED_SHA"
          
          if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
            echo "✓ SHA verification passed — deployed commit matches release commit"
          else
            echo "✗ SHA verification failed — deployed commit does not match"
            echo "  This indicates a critical safety violation"
            echo "  The deployed code does not match the migrated code"
            exit 1
          fi

  # ── Step 11: Health check ────────────────────────────────────────────────
  health-check:
    name: Health Check Verification
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    environment: staging
    
    steps:
      - name: Check readiness endpoint
        run: |
          HEALTH_URL="https://scs-api-staging.onrender.com/v1/readyz"
          MAX_RETRIES=10
          RETRY_INTERVAL=10
          
          echo "Checking health endpoint..."
          echo "  URL: $HEALTH_URL"
          echo "  Max retries: $MAX_RETRIES"
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "  Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            
            echo "  Health check returned HTTP $HTTP_CODE"
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "  Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          
          echo "✗ Health check failed after $MAX_RETRIES attempts"
          exit 1

  # ── Step 12: Publish release summary ─────────────────────────────────────
  summary:
    name: Publish Release Summary
    runs-on: ubuntu-latest
    needs: [validate, database-release, deploy, health-check]
    if: always()
    
    steps:
      - name: Generate release summary
        run: |
          RELEASE_SHA="${{ needs.validate.outputs.release_sha }}"
          CI_RUN_ID="${{ needs.validate.outputs.ci_run_id }}"
          CI_RUN_URL="${{ needs.validate.outputs.ci_run_url }}"
          DEPLOY_ID="${{ needs.deploy.outputs.deploy_id }}"
          DEPLOY_STATUS="${{ needs.deploy.outputs.deploy_status }}"
          
          echo "# 🚀 Staging Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release SHA:** \`$RELEASE_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "**CI Run:** [$CI_RUN_ID]($CI_RUN_URL)" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy ID:** \`$DEPLOY_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Status:** $DEPLOY_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** https://scs-api-staging.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determine overall status
          if [ "${{ needs.database-release.result }}" = "success" ] && \
             [ "${{ needs.deploy.result }}" = "success" ] && \
             [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "## ✅ Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All 12 steps completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Step Results:**" >> $GITHUB_STEP_SUMMARY
            echo "- Validate: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Database Release: ${{ needs.database-release.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Health Check: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Architecture v2.1 — GitHub Actions release orchestrator*" >> $GITHUB_STEP_SUMMARY
