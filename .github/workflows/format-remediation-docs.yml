name: Temporary remediation documentation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security

permissions:
  contents: write

concurrency:
  group: temporary-remediation-doc-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the exact CI-reported files
        run: |
          set -euo pipefail
          test "$(pnpm exec prettier --version)" = "3.9.6"
          pnpm exec prettier --write \
            docs/remediation/G-002-RLS-ARCHITECTURE-DESIGN.md \
            docs/remediation/G-002-TABLE-OWNERSHIP-MATRIX.md \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/CURRENT-STATE.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/START-HERE.md \
            project-memory/WORK-LOG.md
          pnpm exec prettier --check \
            docs/remediation/G-002-RLS-ARCHITECTURE-DESIGN.md \
            docs/remediation/G-002-TABLE-OWNERSHIP-MATRIX.md \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/CURRENT-STATE.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/START-HERE.md \
            project-memory/WORK-LOG.md
      - name: Commit formatted documents and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/format-remediation-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/G-002-RLS-ARCHITECTURE-DESIGN.md docs/remediation/G-002-TABLE-OWNERSHIP-MATRIX.md docs/remediation/IMPLEMENTATION-PROGRESS.md project-memory/CURRENT-STATE.md project-memory/OPEN-ISSUES.md project-memory/RELEASE-AND-CI-STATUS.md project-memory/START-HERE.md project-memory/WORK-LOG.md .github/workflows/format-remediation-docs.yml
          git diff --cached --check
          git commit -m "style(docs): format remediation checkpoint files"
          git push origin HEAD:remediation/phase-0-1-tenant-security
