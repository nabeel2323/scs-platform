name: Format remediation tracking documents

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - docs/remediation/IMPLEMENTATION-PLAN.md
      - docs/remediation/IMPLEMENTATION-PROGRESS.md
      - docs/remediation/DATABASE-TABLE-ACCESS-CLASSIFICATION-2026-11-19.md
      - docs/remediation/G-002-RLS-ARCHITECTURE-PROPOSAL.md
      - docs/production/CAPABILITY-MATRIX.md
      - docs/pilot/go-no-go-checklist.md
      - docs/monitoring/slo-and-alerting.md
      - docs/playbooks/operational-playbooks.md
      - apps/api/src/__tests__/unit/shipping-carrier-worker-label.spec.ts
      - apps/api/src/__tests__/unit/payments/payments-controller-tenant-scope.spec.ts
      - apps/api/src/__tests__/integration/p311-tenant-isolation.postgres.spec.ts
      - apps/api/src/modules/payments/payments.controller.ts
      - apps/api/src/modules/payments/payments.service.ts

permissions:
  contents: write

concurrency:
  group: remediation-doc-format
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/remediation/phase-0-1-tenant-security' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format remediation documents with repository Prettier
        run: pnpm exec prettier --write docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/DATABASE-TABLE-ACCESS-CLASSIFICATION-2026-11-19.md docs/remediation/G-002-RLS-ARCHITECTURE-PROPOSAL.md docs/production/CAPABILITY-MATRIX.md docs/pilot/go-no-go-checklist.md docs/monitoring/slo-and-alerting.md docs/playbooks/operational-playbooks.md apps/api/src/modules/payments/payments.service.ts apps/api/src/modules/payments/payments.controller.ts apps/api/src/__tests__/integration/p311-tenant-isolation.postgres.spec.ts apps/api/src/__tests__/unit/payments/payments-controller-tenant-scope.spec.ts apps/api/src/__tests__/unit/shipping-carrier-worker-label.spec.ts
      - name: Commit formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/DATABASE-TABLE-ACCESS-CLASSIFICATION-2026-11-19.md docs/remediation/G-002-RLS-ARCHITECTURE-PROPOSAL.md docs/production/CAPABILITY-MATRIX.md docs/pilot/go-no-go-checklist.md docs/monitoring/slo-and-alerting.md docs/playbooks/operational-playbooks.md apps/api/src/modules/payments/payments.service.ts apps/api/src/modules/payments/payments.controller.ts apps/api/src/__tests__/integration/p311-tenant-isolation.postgres.spec.ts apps/api/src/__tests__/unit/payments/payments-controller-tenant-scope.spec.ts apps/api/src/__tests__/unit/shipping-carrier-worker-label.spec.ts; then
            echo "Remediation and readiness documents already satisfy Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/DATABASE-TABLE-ACCESS-CLASSIFICATION-2026-11-19.md docs/remediation/G-002-RLS-ARCHITECTURE-PROPOSAL.md docs/production/CAPABILITY-MATRIX.md docs/pilot/go-no-go-checklist.md docs/monitoring/slo-and-alerting.md docs/playbooks/operational-playbooks.md apps/api/src/modules/payments/payments.service.ts apps/api/src/modules/payments/payments.controller.ts apps/api/src/__tests__/integration/p311-tenant-isolation.postgres.spec.ts apps/api/src/__tests__/unit/payments/payments-controller-tenant-scope.spec.ts apps/api/src/__tests__/unit/shipping-carrier-worker-label.spec.ts
          git commit -m "style(docs): format remediation and readiness docs"
          git push origin HEAD:remediation/phase-0-1-tenant-security
