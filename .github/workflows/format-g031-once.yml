name: One-time G-031 permission and evidence formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - apps/api/src/common/database/rbac-seed.data.ts
      - apps/api/src/modules/admin/admin.controller.ts
      - apps/api/src/__tests__/unit/rbac/merchant-rbac.spec.ts
      - apps/admin/src/components/ProductDetails.tsx
      - apps/admin/src/__tests__/management.test.tsx
      - docs/admin/rbac-architecture.md
      - docs/admin/rbac-guide.md
      - docs/remediation/IMPLEMENTATION-PLAN.md
      - docs/remediation/IMPLEMENTATION-PROGRESS.md

permissions:
  contents: write

concurrency:
  group: g031-permission-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/remediation/phase-0-1-tenant-security' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed implementation and documentation
        run: |
          pnpm exec prettier --write \
            apps/api/src/common/database/rbac-seed.data.ts \
            apps/api/src/modules/admin/admin.controller.ts \
            apps/api/src/__tests__/unit/rbac/merchant-rbac.spec.ts \
            apps/admin/src/components/ProductDetails.tsx \
            apps/admin/src/__tests__/management.test.tsx \
            docs/admin/rbac-architecture.md \
            docs/admin/rbac-guide.md \
            docs/remediation/IMPLEMENTATION-PLAN.md \
            docs/remediation/IMPLEMENTATION-PROGRESS.md
      - name: Commit formatting
        run: |
          set -euo pipefail
          files=(apps/api/src/common/database/rbac-seed.data.ts apps/api/src/modules/admin/admin.controller.ts apps/api/src/__tests__/unit/rbac/merchant-rbac.spec.ts apps/admin/src/components/ProductDetails.tsx apps/admin/src/__tests__/management.test.tsx docs/admin/rbac-architecture.md docs/admin/rbac-guide.md docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md)
          if git diff --quiet -- "${files[@]}"; then
            echo "G-031 implementation and evidence files already satisfy Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "style(rbac): format product moderation permission change"
          git pull --rebase --autostash origin remediation/phase-0-1-tenant-security
          git push origin HEAD:remediation/phase-0-1-tenant-security
