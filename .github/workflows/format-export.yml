name: Temporary G-001 Test Formatting Export

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-formatted-tests:
    if: github.repository == 'nabeel2323/scs-platform' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remediation/phase-0-1-tenant-security'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format G-001 service and regression tests
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/catalog/catalog.offer.service.ts \
            apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts \
            apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts \
            .github/workflows/format-export.yml
      - name: Emit formatted source
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = [
            'apps/api/src/modules/catalog/catalog.offer.service.ts',
            'apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts',
            'apps/api/src/__tests__/unit/catalog/catalog-offer-controller.spec.ts',
          ];
          for (const file of files) {
            const encoded = readFileSync(file).toString('base64');
            console.log('FORMAT_EXPORT_BEGIN:' + file);
            for (let i = 0; i < encoded.length; i += 30000) {
              console.log('FORMAT_EXPORT_CHUNK:' + encoded.slice(i, i + 30000));
            }
            console.log('FORMAT_EXPORT_END:' + file);
          }
          NODE
