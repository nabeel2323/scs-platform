name: G-001 Formatting Export (Temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format G-001 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts \
            'apps/web/src/app/products/[id]/ProductDetailClient.tsx' \
            apps/web/src/hooks/useOfferComparison.ts \
            apps/web/src/lib/buyer-api.ts \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/CURRENT-STATE.md \
            project-memory/DECISIONS-AND-CONSTRAINTS.md \
            project-memory/IMPLEMENTATION-ROADMAP.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/START-HERE.md \
            project-memory/WORK-LOG.md
      - name: Export formatted files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/__tests__/unit/catalog/catalog-offer.spec.ts
            'apps/web/src/app/products/[id]/ProductDetailClient.tsx'
            apps/web/src/hooks/useOfferComparison.ts
            apps/web/src/lib/buyer-api.ts
            docs/remediation/IMPLEMENTATION-PROGRESS.md
            project-memory/CURRENT-STATE.md
            project-memory/DECISIONS-AND-CONSTRAINTS.md
            project-memory/IMPLEMENTATION-ROADMAP.md
            project-memory/OPEN-ISSUES.md
            project-memory/RELEASE-AND-CI-STATUS.md
            project-memory/START-HERE.md
            project-memory/WORK-LOG.md
          )
          for file in "${files[@]}"; do
            echo "FORMAT_EXPORT_BEGIN:${file}"
            base64 -w0 "${file}" | fold -w 4000 | sed 's/^/FORMAT_EXPORT_CHUNK:/'
            echo "FORMAT_EXPORT_END:${file}"
          done
