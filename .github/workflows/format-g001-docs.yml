name: Temporary G-001 documentation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - docs/remediation/IMPLEMENTATION-PROGRESS.md
      - project-memory/*.md
      - .github/workflows/format-g001-docs.yml

permissions:
  contents: write

concurrency:
  group: temporary-g001-doc-format
  cancel-in-progress: false

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format handover documents
        run: |
          pnpm exec prettier --write \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/START-HERE.md \
            project-memory/CURRENT-STATE.md \
            project-memory/IMPLEMENTATION-ROADMAP.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/WORK-LOG.md
      - name: Remove temporary workflow and push
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/format-g001-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/IMPLEMENTATION-PROGRESS.md
          git add project-memory/START-HERE.md project-memory/CURRENT-STATE.md
          git add project-memory/IMPLEMENTATION-ROADMAP.md project-memory/OPEN-ISSUES.md
          git add project-memory/RELEASE-AND-CI-STATUS.md project-memory/WORK-LOG.md
          git add -u .github/workflows/format-g001-docs.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format CI 1275 handover records"
          git push origin "HEAD:${BRANCH_NAME}"
