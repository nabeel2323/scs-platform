name: Temporary G-001 documentation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md
      - docs/remediation/IMPLEMENTATION-PROGRESS.md
      - project-memory/*.md
      - .github/workflows/format-g001-docs.yml

permissions:
  contents: write

concurrency:
  group: temporary-g001-doc-format
  cancel-in-progress: false

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed handover documents
        run: |
          pnpm exec prettier --write \
            docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            project-memory/START-HERE.md \
            project-memory/CURRENT-STATE.md \
            project-memory/IMPLEMENTATION-ROADMAP.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/WORK-LOG.md

      - name: Remove temporary formatter and push formatted docs
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/format-g001-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md
          git add docs/remediation/IMPLEMENTATION-PROGRESS.md
          git add project-memory/START-HERE.md project-memory/CURRENT-STATE.md
          git add project-memory/IMPLEMENTATION-ROADMAP.md project-memory/OPEN-ISSUES.md
          git add project-memory/RELEASE-AND-CI-STATUS.md project-memory/WORK-LOG.md
          git add -u .github/workflows/format-g001-docs.yml
          if git diff --cached --quiet; then
            echo "No formatting changes; temporary workflow already removed."
            exit 0
          fi
          git commit -m "style: format G-001 security review documentation"
          git push origin "HEAD:${BRANCH_NAME}"
