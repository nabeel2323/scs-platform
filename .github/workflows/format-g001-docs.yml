name: Temporary G-001 documentation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - 'project-memory/**'
      - 'docs/remediation/IMPLEMENTATION-PROGRESS.md'
      - 'docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md'
      - '.github/workflows/format-g001-docs.yml'

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format handover and remediation documents
        run: |
          pnpm exec prettier --write \
            project-memory/START-HERE.md \
            project-memory/CURRENT-STATE.md \
            project-memory/IMPLEMENTATION-ROADMAP.md \
            project-memory/OPEN-ISSUES.md \
            project-memory/RELEASE-AND-CI-STATUS.md \
            project-memory/WORK-LOG.md \
            docs/remediation/IMPLEMENTATION-PROGRESS.md \
            docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md
      - name: Remove temporary formatter and commit formatted docs
        run: |
          rm .github/workflows/format-g001-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-memory docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/G-001-INDEPENDENT-SECURITY-REVIEW-PACKET.md .github/workflows/format-g001-docs.yml
          git commit -m "style(docs): format G-001 verification handover"
          git push origin remediation/phase-0-1-tenant-security
