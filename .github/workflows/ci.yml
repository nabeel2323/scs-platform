# ============================================================
# Smart Commerce & Supply Platform â€” CI Pipeline
# ============================================================
# PR: lint â†’ typecheck â†’ boundary-lint â†’ unit(+coverage gates) â†’ integration
#     â†’ migration dry-run â†’ contract â†’ build â†’ mobile(analyze+test) â†’ smoke
# main: all of PR + E2E + k6 smoke + Lighthouse + axe
#       â†’ staging deploy
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Supersede stale runs on every ref EXCEPT develop.
#
# Why develop is excluded: `trigger-staging-release` is not a separate workflow
# run — it calls release.yml as a reusable workflow, so the release's jobs
# (`validate`, `database-release`, `deploy`, `health-check`) execute as jobs of
# THIS run. A `cancel-in-progress: true` on the develop group therefore meant a
# second push to develop could terminate the run that was hosting an
# in-flight `database-release` step, i.e. kill a migration mid-flight and leave
# the staging schema half-migrated. (Audited as R-1 / finding F-2; the
# cancellation mechanism was demonstrated live on run #424, where a newer run
# in the same group cancelled the in-flight job and `Trigger Staging Release`
# was recorded `skipped` at the identical timestamp.)
#
# Behaviour after this change:
#   push events   -> group CI-develop: one run executes, a second queues behind
#                    it (`cancel-in-progress` evaluates false, so the running
#                    release is never interrupted).
#   pull_request  -> group CI-<pr ref>: `cancel-in-progress` evaluates true, so
#                    every new push to an open PR still replaces the older
#                    in-progress run. Feature-branch and PR feedback speed is
#                    unchanged — no release path exists on those events
#                    (`trigger-staging-release` is gated to `push` + develop).
#   push to main  -> also cancels in-progress main runs, as before; main cannot
#                    start a staging release (the job `if` requires develop).
#
# `cancel-in-progress` accepts an expression; the permitted contexts for a
# `concurrency` expression are `github`, `inputs` and `vars`, so `github.ref`
# is available here.
#
# Deliberately NOT set on this workflow: `queue: max`. GitHub rejects the
# combination of `queue: max` with `cancel-in-progress: true` at validation
# time, and this workflow's value is an expression that evaluates to `true` for
# most refs — so `queue: max` is applied instead to release.yml's own
# always-literal-`false` `staging-release` group (see that file). The
# consequence for develop is documented: the group holds one running run plus
# at most ONE pending run, and a third push replaces the older pending run.
# That is acceptable because a replaced run has not started, so nothing can be
# mid-migration; see §"Remaining limitations" in
# docs/deployment/PR-106-WORKFLOW-SAFETY-HARDENING-REPORT.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

# Workflow-level GITHUB_TOKEN scopes.
#
# GitHub intersects a CALLED reusable workflow's `permissions:` with the
# CALLER's workflow-level permissions — job-level permissions do not propagate
# into the callee. `trigger-staging-release` calls release.yml, which needs
# `actions: read` for its `gh run list` stale-release detection, so that scope
# has to be granted here (CI run #418 failed at start-up precisely because it
# was not: "requesting 'actions: read', but is only allowed 'actions: none'").
#
# This block mirrors the repository's read-only default
# (`contents: read, packages: read`) and adds `actions: read`. Nothing in CI
# writes: container-build uses `push: false`, and no job posts PR comments or
# uploads SARIF. No write scope is granted anywhere here.
permissions:
  contents: read
  packages: read
  actions: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # â”€â”€ Lint & Typecheck â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Advisory only. This repo predates Prettier enforcement: it has repo-wide
      # formatting debt plus CRLF line endings (core.autocrlf on Windows, no
      # .gitattributes) while .prettierrc requires endOfLine=lf. Normalizing 100+
      # untouched files is out of scope for the Phase 1 gap fixes, so this step
      # reports the debt without blocking PRs. New/changed files are expected to
      # be Prettier-clean.
      # TODO(repo-hygiene): add `.gitattributes` (`* text=auto eol=lf`), run
      # `git add --renormalize .` and `prettier --write` in a dedicated commit,
      # then drop `continue-on-error` to make this gate blocking.
      - run: pnpm format:check
        continue-on-error: true

  # â”€â”€ Boundary Lint (E6) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  boundary-lint:
    name: Boundary Lint (E6)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory: eslint-plugin-boundaries is not yet wired into the flat config
      # and some modules still cross-import (e.g. orders.service pulls other
      # modules' schemas), so this gate is non-blocking until boundaries are
      # cleaned up. The plain API lint (errors) still runs in the `lint` job.
      - run: pnpm --filter @scs/api lint
        continue-on-error: true

  # â”€â”€ Unit Tests + Coverage Gates â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  test-unit:
    name: Unit Tests + Coverage Gates
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs the full API suite under v8 coverage and enforces the thresholds
      # in apps/api/vitest.config.ts (global floor + per-module gates on the
      # identity and orders bounded contexts). Fails the build on regression.
      # S1.38.9 note: self-provisioning `@testcontainers/postgresql` integration
      # specs are collected through this broad include (see apps/api/vitest.config.ts
      # `include: ['src/__tests__/**/*.spec.ts']`) and their coverage contribution
      # is required to keep the aggregate orders-module threshold (lines 40% /
      # functions 60% / branches 70% / statements 40%) above the floor. Isolating
      # the coverage job to unit specs only would push orders to ~31/44/58/31 and
      # fail the gate. Real-Redis ambient-service suites still correctly self-skip
      # because they gate on `REDIS_IT === '1'`, which this job never exports.
      # Follow-up scope (owner): author additional orders-module unit tests so the
      # coverage job can be position-filtered to `src/__tests__/unit` without
      # dropping below the per-module thresholds — that would be a cleaner
      # separation between the unit-coverage and integration jobs.
      - run: pnpm --filter @scs/api test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: apps/api/coverage/

  # ---- Web & Admin App Tests (Phase 1 hydration remediation) ----
  #
  # Why this job exists: before Phase 1 the CI pipeline ran only the API suites
  # (`test-unit` and `test-integration` both target @scs/api) and the root
  # `pnpm test` task was never invoked. `lint` does run `pnpm lint` +
  # `pnpm typecheck` over every package through turbo, so the two Next apps were
  # type-checked and linted but had no test gate at all -- a regression in the
  # root-layout CSS or the Admin dashboard clock could have merged green.
  #
  # It gates PR/push checks only. Nothing here touches the release path:
  # `trigger-staging-release` still calls release.yml unchanged, and the `build`
  # job's `needs` list is unchanged, so this adds a check rather than re-wiring
  # an existing one.
  test-web-admin:
    name: Web & Admin App Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both apps import the generated client from @scs/contracts, whose
      # package.json resolves to ./dist/src/index.js -- the built output, not the
      # source (@scs/ui-kit and @scs/env resolve to src and need no build). These
      # steps bypass turbo so the vitest command lines stay explicit, which also
      # means the dependency build that turbo's `test` task would pull in through
      # `dependsOn: ['^build']` has to happen here instead. Same reasoning the
      # integration job documents at S1.28 D-CI-3.
      - run: pnpm contracts:build
      # apps/web: the whole suite runs. It was green at the Phase 1 baseline, and
      # Phase 1 added the Buyer document-root hydration specs to it.
      - run: pnpm --filter @scs/web test
      # apps/admin: position-filtered to the Phase 1 files rather than the whole
      # package, because 2 tests in src/__tests__/management.test.tsx were
      # already failing at baseline 09f6d7d5 (verified by running that file
      # against an untouched checkout of the same commit: the same 2 failures,
      # with a byte-identical 6-file import graph). They assert on the shared
      # management components, not on hydration, and fixing them is outside
      # Phase 1's scope. Tracked as a remaining issue; when they are fixed,
      # replace this step with `pnpm --filter @scs/admin test`.
      - name: Admin hydration + global-styles regression tests
        run: >
          pnpm --filter @scs/admin test --
          src/__tests__/hydration-document-root.test.tsx
          src/__tests__/global-styles.test.tsx
          src/__tests__/sidebar-styles.test.tsx
          src/__tests__/hydration-admin-clock.test.tsx
          src/__tests__/hydration-admin-session.test.tsx
          src/__tests__/hydration-admin-perms.test.tsx

  # â”€â”€ Integration Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: scs
          POSTGRES_PASSWORD: scs_test
          POSTGRES_DB: scs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # S1.12 D-CI-1: this Redis is a GitHub Actions service container — created for
      # this job run and destroyed with it. It happens to share the address a
      # developer would use for a persistent local instance, which is why the test
      # harness decides safety from CI context plus an explicit attestation below,
      # never from the port number alone.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # S1.12 D-CI-2: `pnpm --filter @scs/api test:integration` runs Vitest with
      # --no-file-parallelism (set in apps/api/package.json) so suites that share the
      # scs:throttle: namespace cannot clean up each other's keys. Never invoke
      # `vitest run src/__tests__/integration` directly here — that would bypass the
      # guard.
      # S1.12 D-SAFE-1: the real-Redis suites require an explicit disposability
      # attestation, because a supplied URL alone is not proof the target is safe to
      # write to. This job's Redis is ephemeral by construction, so the attestation
      # is accurate; a developer reusing the same address for a persistent instance
      # is refused by the harness (it checks CI context, not just the port).
      # S1.28 D-CI-3: the workspace root's `pnpm test:integration` invokes
      # `turbo run test:integration`, and Turborepo 2.x with any `globalEnv` /
      # `env` declaration restricts the child process environment to the declared
      # variables. Redis IT opt-ins are intentionally kept local to this step, so
      # the CI job bypasses turbo via `--filter @scs/api` — matching the pattern
      # already used by the sibling `test-unit` job (`pnpm --filter @scs/api
      # test:coverage`). Local developers may still invoke `pnpm test:integration`
      # from the repo root and export the vars themselves; the turbo task remains
      # unchanged.
      - run: pnpm --filter @scs/api test:integration
        env:
          DATABASE_URL: postgresql://scs:scs_test@localhost:5432/scs_test
          REDIS_URL: redis://localhost:6379
          REDIS_IT: '1'
          REDIS_DISPOSABLE_ACK: '1'
      # S1.28 diagnostic follow-up (non-blocking, always exit 0): vitest's JSON
      # reporter suppresses ::error:: workflow commands, so failure annotations
      # otherwise collapse to a bare "exit code 1". This step parses the same
      # JSON report the assertion gate consumed and publishes failing test
      # names to $GITHUB_STEP_SUMMARY, which is publicly readable on the run
      # page. It changes no expectations and hides no failures — it only makes
      # them visible without authenticated log access.
      - name: Summarize vitest failures in job summary
        if: failure()
        working-directory: apps/api
        run: node scripts/summarize-vitest-failures.mjs .vitest-integration-results.json

  # ── Migration Gate (enforcing — full chain with pg_partman) ──
  migration-gate:
    name: Migration Full Apply
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: postgresql://scs:scs_test@localhost:5433/scs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
  
      # Build the CI postgres image with PostGIS + pg_partman from the repo Dockerfile.
      # This ensures the migration gate uses the same extension set as production.
      - name: Build CI postgres image (PostGIS + pg_partman)
        run: docker build -t scs-ci-postgres:ci -f infra/deploy/ci-postgres.Dockerfile infra/deploy/
  
      # Start a disposable postgres container from the custom image.
      - name: Start disposable postgres with pg_partman
        run: |
          docker run -d --name ci-migration-pg \
            -e POSTGRES_USER=scs -e POSTGRES_PASSWORD=scs_test -e POSTGRES_DB=scs_test \
            -p 5433:5432 scs-ci-postgres:ci
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            docker exec ci-migration-pg pg_isready -U scs -d scs_test && break
            sleep 1
          done

      # 1) Enforcing gate: validate every migration file exists, is ordered and
      #    non-empty, and that the DB is reachable — without writing.
      - name: Dry-run (validate ordering)
        run: pnpm --filter @scs/api run db:migrate:ci -- --dry-run
  
      # 2) ENFORCING: Full migration apply. All migration files must apply cleanly,
      #    including 0013 and 0018 which require pg_partman. No continue-on-error.
      #    If any migration fails, the gate fails and the PR cannot merge.
      - name: Full migration apply (enforcing — all discovered files)
        run: pnpm --filter @scs/api run db:migrate:ci
  
      # 3) Verify pg_partman is configured after migration
      - name: Verify pg_partman partitioning
        run: |
          docker exec ci-migration-pg psql -U scs -d scs_test -c \
            "SELECT parent_table, partition_type, partition_interval FROM partman.part_config;"
  
      - name: Cleanup
        if: always()
        run: docker rm -f ci-migration-pg 2>/dev/null || true

  # â”€â”€ Contract Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  test-contract:
    name: Contract Spec & Codegen
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:generate
      # Structural gate: the spec must expose the shared auth/profile paths AND
      # the reusable component schemas the generated clients derive from. A spec
      # that regresses to inline-only bodies or drops a path fails here (ADM-B3).
      - name: Validate OpenAPI spec structure
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const spec = JSON.parse(fs.readFileSync("packages/contracts/openapi/openapi.json", "utf8"));
            const paths = Object.keys(spec.paths || {});
            const schemas = Object.keys((spec.components || {}).schemas || {});
            const needPaths = [
              "/v1/auth/otp/request", "/v1/auth/otp/verify", "/v1/auth/refresh",
              "/v1/auth/logout", "/v1/auth/switch-org", "/v1/auth/login/password",
              "/v1/auth/login/device-check", "/v1/me", "/v1/me/sessions",
              // S1.37-F-09: the six Phase 1 email-identity routes. They shipped in the
              // controller while this gate still only knew the pre-Phase-1 surface, which
              // is exactly how the omission survived — the gate could not fail for paths
              // it never listed.
              "/v1/auth/otp/email/request", "/v1/auth/otp/email/verify",
              "/v1/auth/account/link-email", "/v1/auth/account/link-phone",
              "/v1/auth/account/unlink-email", "/v1/auth/account/unlink-phone",
            ];
            const needSchemas = [
              "AuthTokens", "RefreshResponse", "SwitchOrgResponse",
              "LoginPasswordResponse", "DeviceCheckResponse", "SessionInfo",
              "UserProfile", "ProblemDetail",
              // S1.37-F-09: Phase 1 request/response component schemas.
              "EmailOtpRequest", "EmailOtpVerify", "EmailOtpRequestResponse",
              "AccountLinkEmail", "AccountLinkPhone", "AccountLinkResponse",
            ];
            const mp = needPaths.filter((p) => !paths.includes(p));
            const ms = needSchemas.filter((s) => !schemas.includes(s));
            if (mp.length) { console.error("Missing paths:", mp.join(", ")); process.exit(1); }
            if (ms.length) { console.error("Missing component schemas:", ms.join(", ")); process.exit(1); }
            console.log(`OpenAPI spec valid: ${paths.length} paths, ${schemas.length} shared schemas`);
          '
      # Validate the TS half of "OpenAPI to TS + Dart" produces a client artifact.
      - name: Generate TS client
        run: pnpm --filter @scs/contracts generate:ts
      - name: Verify TS client artifact
        run: |
          set -euo pipefail
          test -f packages/contracts/generated/api.d.ts || { echo "TS client not generated"; exit 1; }
          echo "TS client generated (generated/api.d.ts)"
      # S1.37-F-09: the structural gate above lists paths by hand. This reconciles the
      # three surfaces automatically — the route table AuthController actually declares,
      # the generated OpenAPI document, and the generated TypeScript client — so a new
      # endpoint can never again be added to the API without also reaching the contract.
      # It runs here rather than in the unit job because both artifacts are build outputs
      # produced by the steps above.
      - name: Contract drift guard (controller vs OpenAPI vs generated client)
        run: pnpm --filter @scs/api exec vitest run src/__tests__/unit/contracts-phase1.openapi.spec.ts
      # NOTE: the Dart half (`generate:dart`, openapi-generator-cli) needs Java 11+
      # and is validated locally; it is wired into the mobile job once the app
      # consumes the generated client (see the P2 mobile typed-models work).

  # â”€â”€ Build â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # â”€â”€ k6 Smoke Test (main only) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  k6-smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/load/smoke.js

  # â”€â”€ Mobile (Flutter): dart analyze + tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mobile:
    name: Mobile (flutter analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter pub get

      # Analyze only the main mobile application.
      # mobile-core is a separate Flutter package and is analyzed
      # independently with its own package-local dependencies.
      - run: flutter analyze --no-fatal-infos lib test

      - run: flutter pub get
        working-directory: ${{ github.workspace }}/mobile/packages/mobile-core

      - run: flutter analyze
        working-directory: ${{ github.workspace }}/mobile/packages/mobile-core

      - run: flutter test

  # --- Container Build & Smoke Test (Phase 4.1.2) ---
  container-build:
    name: Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/deploy/api.Dockerfile
          push: false
          load: true
          tags: scs-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run deployment invariants spec
        run: |
          pnpm install --frozen-lockfile
          # Run ONLY the deployment-invariants spec as a positional file argument.
          # `--run` is a test-name pattern, not a file filter, so it would collect
          # every *.spec.ts (including 25+ Testcontainers-backed PostgreSQL specs)
          # and run them in parallel. Parallel Testcontainers instances compete for
          # the Ryuk/Reaper sidecar and surface as "Failed to connect to Reaper" at
          # migration-lock.postgres.spec.ts:17. --no-file-parallelism serializes
          # file execution so no two Testcontainers lifecycles overlap.
          pnpm --filter @scs/api run test -- --no-file-parallelism src/__tests__/unit/deployment/p41-deployment-invariants.spec.ts

      - name: Start disposable services
        run: |
          docker network create ci-smoke-net
          docker run -d --name ci-postgres --network ci-smoke-net \
            -e POSTGRES_PASSWORD=scs -e POSTGRES_USER=scs -e POSTGRES_DB=scs_platform \
            postgres:16-alpine
          docker run -d --name ci-redis --network ci-smoke-net redis:7-alpine
          sleep 10

      # S1.28 D-CI-4: `main.ts` bootstrap calls `assertOtpHmacConfig()` (added by
      # S1.3 / audit finding M-02). It fails the process under NODE_ENV=production
      # when OTP_HMAC_SECRET missing, is the `.env.example` placeholder, or is
      # shorter than 32 chars. The container-build smoke test starts the image with
      # NODE_ENV=production, so the CI value below must satisfy the same rules as
      # any deployment: non-empty, >= 32 chars, not the dev placeholder. It is a
      # throwaway per-run value — no secret material is stored in the workflow.
      #
      # S1.42 CI remediation: `assertOtpDeliveryConfig()` (email-only release,
      # commit 3c246e7) refuses to boot a production process that has no permitted
      # OTP delivery channel. The default channel is email, and SMTP is considered
      # configured when SMTP_HOST and SMTP_FROM are both set (provider.config.ts
      # line 299). The smoke test never sends email, so throwaway values satisfy
      # the gate without incurring any real SMTP dependency.
      - name: Start API container with safe defaults
        run: |
          docker run -d --name ci-api --network ci-smoke-net \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://scs:scs@ci-postgres:5432/scs_platform \
            -e REDIS_URL=redis://ci-redis:6379 \
            -e JWT_ACCESS_SECRET='ci-test-secret-at-least-16-chars!!' \
            -e OTP_HMAC_SECRET='ci-test-otp-hmac-secret-at-least-32-chars!!' \
            -e SCS_BOOTSTRAP_OWNER_EMAIL='ci-owner@example.com' \
            -e SMTP_HOST=smtp.ci-test.local \
            -e SMTP_FROM=otp@ci-test.local \
            -e S3_ENDPOINT=http://minio:9000 \
            -e S3_ACCESS_KEY=ci-test-key \
            -e S3_SECRET_KEY=ci-test-secret \
            -e API_CORS_ORIGINS=https://shop.example.com \
            -e P13_WORKER_ENABLED=false \
            -e P13_PILOT_MODE=legacy \
            scs-api:ci-test
          sleep 15

      - name: Verify health endpoints
        run: |
          echo "=== Container State ==="
          docker inspect ci-api --format='{{.State.Status}} (exit code: {{.State.ExitCode}})' || true
          echo ""
          echo "=== Liveness ==="
          docker exec ci-api curl -fsS http://localhost:3000/v1/healthz || {
            echo "ERROR: Liveness check failed"
            echo ""
            echo "=== API Container Logs (last 50 lines) ==="
            docker logs --tail 50 ci-api 2>&1 || true
            exit 1
          }
          echo ""
          echo "=== Readiness ==="
          docker exec ci-api curl -fsS http://localhost:3000/v1/readyz || {
            echo "ERROR: Readiness check failed"
            echo ""
            echo "=== API Container Logs (last 50 lines) ==="
            docker logs --tail 50 ci-api 2>&1 || true
            exit 1
          }
          echo ""

      - name: Verify P13 configuration
        run: |
          echo "=== P13 Worker Status ==="
          docker exec ci-api sh -c 'echo "P13_WORKER_ENABLED=$P13_WORKER_ENABLED"'
          echo "=== P13 Pilot Mode ==="
          docker exec ci-api sh -c 'echo "P13_PILOT_MODE=$P13_PILOT_MODE"'

      - name: Verify non-root user
        run: |
          CONTAINER_USER=$(docker exec ci-api whoami)
          echo "Container running as: $CONTAINER_USER"
          if [ "$CONTAINER_USER" = "root" ]; then
            echo "ERROR: Container running as root"
            exit 1
          fi
          echo "OK: Container running as non-root user"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-api ci-postgres ci-redis 2>/dev/null || true
          docker network rm ci-smoke-net 2>/dev/null || true
          docker rmi scs-api:ci-test 2>/dev/null || true

  # ── Staging Release (develop push only, after all mandatory CI gates) ────
  # This job invokes release.yml as a REUSABLE WORKFLOW via job-level `uses:`.
  # A job that calls a reusable workflow CANNOT declare runs-on/steps/environment;
  # the reusable workflow owns its own runners and jobs. Staging secrets are
  # resolved by the called workflow's jobs that each declare `environment: staging`,
  # so the caller forwards them with `secrets: inherit`.
  #
  # Depend on every MANDATORY gate that runs on develop. k6-smoke is intentionally
  # EXCLUDED: it is main-only (`if: github.ref == 'refs/heads/main'`) and is skipped
  # on develop; listing a skipped job in `needs` would cascade-skip this job and the
  # release would never trigger.
  trigger-staging-release:
    name: Trigger Staging Release
    # Only a push to develop in THIS repository can invoke the release.
    # Pull requests and main pushes never reach the release path.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'nabeel2323/scs-platform'
    needs:
      - lint
      - test-unit
      - test-integration
      - migration-gate
      - test-contract
      - build
      - mobile
      - container-build
    uses: ./.github/workflows/release.yml
    with:
      commit_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit