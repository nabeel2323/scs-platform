name: Temporary current-state formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - 'project-memory/CURRENT-STATE.md'
      - 'project-memory/WORK-LOG.md'
      - '.github/workflows/format-current-state.yml'

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format current-state checkpoint
        run: pnpm exec prettier --write project-memory/CURRENT-STATE.md
      - name: Remove temporary formatter and commit
        run: |
          rm .github/workflows/format-current-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-memory/CURRENT-STATE.md project-memory/WORK-LOG.md .github/workflows/format-current-state.yml
          git commit -m "style(docs): format current-state checkpoint"
          git push origin remediation/phase-0-1-tenant-security
