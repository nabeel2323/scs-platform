name: One-time remediation documentation formatter

on:
  push:
    branches:
      - remediation/phase-0-1-tenant-security
    paths:
      - docs/remediation/IMPLEMENTATION-PLAN.md
      - docs/remediation/IMPLEMENTATION-PROGRESS.md

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/phase-0-1-tenant-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/IMPLEMENTATION-PLAN.md docs/remediation/IMPLEMENTATION-PROGRESS.md
          git commit -m "style(docs): format remediation tracking"
          git pull --rebase --autostash origin remediation/phase-0-1-tenant-security
          git push origin HEAD:remediation/phase-0-1-tenant-security
