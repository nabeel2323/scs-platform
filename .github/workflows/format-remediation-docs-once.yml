name: Format remediation docs once

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format remediation documents with repository Prettier
        run: pnpm exec prettier --write docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/IMPLEMENTATION-PLAN.md
      - name: Commit formatting and remove one-time helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remediation/IMPLEMENTATION-PROGRESS.md docs/remediation/IMPLEMENTATION-PLAN.md
          git rm .github/workflows/format-remediation-docs-once.yml
          git commit -m "style(docs): apply repository Prettier to remediation docs"
          git push origin "HEAD:${{ github.head_ref }}"
